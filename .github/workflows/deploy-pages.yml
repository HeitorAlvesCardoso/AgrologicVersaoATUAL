name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agrologic-pages/package-lock.json

      - name: Instalar dependências
        working-directory: agrologic-pages
        run: npm ci

      - name: Gerar o build
        working-directory: agrologic-pages
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Ativa o Pages automaticamente se ainda não estiver ativado
          enablement: true

      - name: Enviar o build como artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: agrologic-pages/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
